name: residential-clothing-automation

# AWS deployment configuration. This intentionally does not start PostgreSQL:
# the application connects to the separately managed private Amazon RDS instance.
services:
  migrate:
    build:
      context: .
    env_file:
      - ${APP_ENV_FILE:-/opt/residential-clothing/app.env}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  app:
    build:
      context: .
    env_file:
      - ${APP_ENV_FILE:-/opt/residential-clothing/app.env}
    ports:
      - "80:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
